name: Vérifier le build Next

# GitHub Pages n’est plus la cible. Le proxy Clerk (src/proxy.ts) ne peut pas
# être exporté en site statique. La publication
# https://enudimmud.github.io/U-TTU-Studio/ s’arrête à la dernière livraison
# (catalogue processus). Auth et suite : Vercel. Voir docs/AUTH.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build serveur, sans clés Clerk
        run: npm run build
